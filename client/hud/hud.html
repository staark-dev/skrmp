<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SKR HUD</title>
<style>
/* SKR HUD — reference geometry 1672 × 941. Transparent CEF page. */
:root {
  --hud-scale: 1;
  --hud-panel: rgba(18,23,30,.76);
  --hud-panel-soft: rgba(18,23,30,.48);
  --hud-border: rgba(177,197,214,.15);
  --hud-text: #f0f4f7;
  --hud-secondary: #a7b4c0;
  --hud-muted: #84939f;
  --hud-cyan: #74dce8;
  --hud-health-low: #e85b68;
  --hud-card: rgba(18,23,30,.84);
  --hud-card-border: rgba(210,225,233,.22);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; pointer-events:none; cursor:none; }
body { font-family:Inter,"Segoe UI",sans-serif; color:var(--hud-text); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
[hidden] { display:none !important; }
.hud { position:fixed; inset:0; background:transparent; pointer-events:none; user-select:none; }
.hud svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.hud-group { position:absolute; transform:scale(var(--hud-scale)); }

/* Chat */
.chat { left:calc(28px * var(--hud-scale)); top:calc(23px * var(--hud-scale)); width:394px; height:113px; padding:5px 10px; border-radius:8px; background:rgba(18,23,30,.55); transform-origin:top left; transition:opacity 250ms linear; display:none; }
.chat.is-visible { display:block; }
.chat.is-idle { opacity:.45; }
.chat__history { height:104px; overflow:hidden; }
.chat__row { display:grid; grid-template-columns:51px minmax(0,1fr); gap:10px; font-size:15px; font-weight:500; line-height:26px; }
.chat__time { color:var(--hud-secondary); }
.chat__message { min-width:0; overflow-wrap:anywhere; }
.chat__channel, .chat__name { color:var(--hud-cyan); font-weight:600; }

/* Identity */
.identity { right:calc(28px * var(--hud-scale)); top:calc(23px * var(--hud-scale)); width:408px; height:48px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; white-space:nowrap; border:1px solid var(--hud-card-border); background:var(--hud-card); border-radius:5px; transform-origin:top right; }
.identity__logo { display:flex; align-items:center; align-self:center; height:38px; line-height:1; font-size:32px; font-weight:700; color:#d4b475; letter-spacing:1px; font-family:'Bahnschrift Condensed','Bahnschrift','Arial Narrow',sans-serif; font-stretch:condensed; }
.identity__subtitle { display:inline-flex; align-items:center; height:20px; line-height:20px; font-size:11px; font-weight:500; color:#bdc3c7; }
.identity__meta { display:inline-flex; align-items:center; height:20px; line-height:20px; font-size:12px; }
.identity__separator { flex:0 0 1px; align-self:center; height:14px; background:rgba(255,255,255,.18); }

/* Money */
.money { right:calc(36px * var(--hud-scale)); top:calc(81px * var(--hud-scale)); width:max-content; max-width:calc((100vw - 56px * var(--hud-scale)) / var(--hud-scale)); height:auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; padding:0; border:0; border-radius:0; background:transparent; transform-origin:top right; }
.money__row { display:flex; justify-content:flex-end; align-items:center; gap:12px; flex:0 0 auto; width:max-content; max-width:100%; min-width:0; height:40px; padding:0 12px; border:1px solid var(--hud-card-border); border-radius:6px; background:var(--hud-card); white-space:nowrap; }
.money__row + .money__row { margin-top:0; }
.money__row svg { flex:0 0 23px; width:23px; height:23px; }
.money__cash { font-size:27px; font-weight:700; }
.money__bank { font-size:23px; font-weight:600; color:#a8aaa7; }
.money__amount { flex:0 1 auto; min-width:0; max-width:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Radar group */
.radar-group { left:calc(28px * var(--hud-scale)); bottom:calc(26px * var(--hud-scale)); width:254px; height:225px; padding:0; background:transparent; border:1px solid var(--hud-card-border); border-radius:10px; transform-origin:bottom left; }
.radar { position:relative; width:100%; max-width:100%; min-width:0; height:176px; }
.radar__surface { position:absolute; inset:0; overflow:hidden; width:auto; max-width:100%; border:none; border-radius:11px; background:transparent; }
.radar__surface > canvas, .radar__surface > img { width:100%; max-width:100%; min-width:0; }
.radar__tiles { display:none; }
.location { width:100%; max-width:100%; min-width:0; }
.radar__north { position:absolute; top:-13px; left:calc(50% - 13px); width:26px; height:26px; border:1px solid var(--hud-border); border-radius:50%; background:#11171d; text-align:center; font-size:17px; font-weight:700; line-height:24px; z-index:3; }
.radar__tiles { position:absolute; }
.radar__tiles img { position:absolute; display:block; max-width:none; image-rendering:auto; }
.radar__player { position:absolute; left:50%; top:50%; width:24px; height:24px; margin-left:-12px; margin-top:-12px; z-index:2; }
.radar__player svg { width:100%; height:100%; }
.radar__pin { position:absolute; left:0; top:0; width:14px; height:18px; margin:-18px 0 0 -7px; z-index:2; }
.radar__pin svg { width:100%; height:100%; display:block; fill:#e85b68; stroke:#fff; stroke-width:1.5; }

/* Location */
.location { height:49px; padding:5px 11px; background:var(--hud-card); border-radius:0 0 9px 9px; }
.location__city { font-size:15px; font-weight:600; line-height:20px; letter-spacing:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.location__area { font-size:14px; line-height:18px; color:var(--hud-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Vitals */
.vitals { left:calc(294px * var(--hud-scale)); bottom:calc(22px * var(--hud-scale)); width:230px; height:130px; background:transparent; border:0; border-radius:0; transform-origin:bottom left; isolation:isolate;
  transform:scale(calc(var(--hud-scale) * 0.85)); }   /* statuses 15% smaller than the rest of the HUD */
.vitals__card { position:absolute; left:0; width:216px; height:36px; border:1px solid var(--hud-card-border); border-radius:6px; background:var(--hud-card); }
.vitals__card--health { top:6px; }
.vitals__card--armour { top:46px; }
.vitals__card--food, .vitals__card--water { top:90px; width:104px; height:36px; }
.vitals__card--water { left:112px; }
.vitals__heart { position:absolute; left:8px; top:13px; width:21px !important; height:21px !important; fill:currentColor !important; }
.vitals__shield { position:absolute; left:8px; top:53px; width:21px !important; height:23px !important; fill:currentColor !important; }
.track { position:absolute; height:10px; overflow:hidden; border:1px solid rgba(255,255,255,.16); border-radius:5px; background:rgba(9,13,18,.70); }
.track__fill { display:block; height:100%; width:0; border-radius:inherit; transition:width 120ms linear; }
.vitals__health { left:42px; top:20px; width:161px; height:10px; }
.vitals__health .track__fill { background:linear-gradient(90deg,#ff1843 0%,#ff6c7d 35%,#f4f5f2 70%); }
.vitals__armour { left:42px; top:60px; width:161px; height:10px; }
.vitals__armour .track__fill { background:linear-gradient(90deg,#00cade,#5de3ec 65%,#d9f2ef); }
.vitals.is-low-health .vitals__health .track__fill { background:var(--hud-health-low); }
.vitals__food { position:absolute; left:10px; top:96px; width:25px !important; height:25px !important; fill:currentColor !important; }
.vitals__food-value { position:absolute; left:48px; top:96px; width:50px; font-size:18px; line-height:25px; font-weight:500; }
.vitals__water { position:absolute; left:120px; top:96px; width:21px !important; height:25px !important; fill:currentColor !important; }
.vitals__water-value { position:absolute; left:151px; top:96px; width:52px; font-size:18px; line-height:25px; font-weight:500; }

/* Vehicle */
.vehicle { right:calc(28px * var(--hud-scale)); bottom:calc(41px * var(--hud-scale)); width:340px; height:116px; border-radius:10px; background:rgba(18,23,30,.76); transform-origin:bottom right; opacity:0; visibility:hidden; transition:opacity 150ms linear,visibility 150ms; }
.vehicle.is-visible { opacity:1; visibility:visible; }
.vehicle__speed { position:absolute; left:21px; top:18px; width:112px; font-size:58px; font-weight:700; line-height:62px; letter-spacing:-1px; }
.vehicle__unit { position:absolute; left:22px; top:83px; font-size:14px; font-weight:500; color:var(--hud-secondary); white-space:nowrap; }
.vehicle__max { margin-left:8px; font-size:12px; color:var(--hud-muted); }
.vehicle__divider { position:absolute; top:17px; width:1px; height:81px; background:rgba(255,255,255,.18); }
.vehicle__divider--first { left:137px; }
.vehicle__divider--second { left:212px; }
.vehicle__gear { position:absolute; left:151px; top:27px; width:44px; text-align:center; font-size:27px; line-height:32px; font-weight:600; }
.vehicle__gear-label { position:absolute; left:149px; top:64px; width:48px; text-align:center; font-size:12px; color:var(--hud-secondary); }
.vehicle__fuel-icon { position:absolute; left:234px; top:16px; width:22px !important; height:22px !important; }
.vehicle__fuel-value { position:absolute; left:271px; top:17px; font-size:15px; line-height:22px; font-weight:500; }
.vehicle__fuel-track { left:233px; top:46px; width:86px; height:7px; }
.vehicle__fuel-track .track__fill { background:linear-gradient(90deg,#00cddd,#d5eeee); }
.vehicle.is-low-fuel .vehicle__fuel-track .track__fill { background:#e6b667; }
.vehicle__belt { position:absolute; left:233px; top:73px; width:26px !important; height:29px !important; color:var(--hud-muted); }
.vehicle__belt.is-fastened { color:var(--hud-cyan); }
.vehicle__engine { position:absolute; left:263px; top:77px; width:26px !important; height:23px !important; color:var(--hud-muted); }
.vehicle__engine.is-on { color:var(--hud-cyan); }
.vehicle__engine.is-warning { color:#e6b667; }
.vehicle__lights { position:absolute; left:293px; top:76px; width:26px !important; height:24px !important; color:var(--hud-muted); }
.vehicle__lights.is-on { color:var(--hud-cyan); }

/* Voice */
.voice { left:50%; bottom:calc(29px * var(--hud-scale)); width:24px; height:24px; display:flex; align-items:center; gap:4px; transform:translateX(-50%) scale(var(--hud-scale)); transform-origin:bottom center; opacity:0; transition:opacity 150ms linear; }
.voice.is-visible { opacity:1; }
.voice__bar { flex:0 0 4px; height:16px; border-radius:2px; background:var(--hud-cyan); }
.voice__bar:nth-child(2) { height:20px; }
.voice.is-talking .voice__bar { animation:voice-level 500ms ease-in-out infinite alternate; }
.voice.is-talking .voice__bar:nth-child(2) { animation-delay:-170ms; }
.voice.is-talking .voice__bar:nth-child(3) { animation-delay:-330ms; }
@keyframes voice-level { from { transform:scaleY(.4); } to { transform:scaleY(1); } }

/* Notifications */
.notifications { position:absolute; top:calc(90px * var(--hud-scale)); left:50%; width:460px; display:grid; gap:8px; transform:translateX(-50%) scale(var(--hud-scale)); transform-origin:top center; }
.notification { padding:12px 16px; background:var(--hud-panel); border:1px solid var(--hud-border); border-radius:8px; font-size:16px; line-height:22px; overflow-wrap:anywhere; }

/* Navigation indicator — above the minimap (reference 1672x941: left 29, bottom 288, 304x76) */
.navigation { left:calc(29px * var(--hud-scale)); bottom:calc(288px * var(--hud-scale)); width:304px; min-height:76px; padding:12px 18px; display:flex; align-items:center; gap:16px; background:rgba(18,23,30,.84); border:1px solid rgba(210,225,233,.10); border-radius:10px; transform-origin:bottom left; pointer-events:none; }
.navigation[hidden] { display:none !important; }
.navigation__arrow { width:40px !important; height:40px !important; flex:0 0 40px; color:#74dce8; fill:none !important; stroke:#74dce8 !important; stroke-width:3 !important; stroke-linejoin:round !important; stroke-linecap:round !important; }
.navigation__arrow--pin { fill:#74dce8 !important; stroke-width:2.4 !important; }
.navigation__content { min-width:0; flex:1; }
.navigation__distance { font-size:26px; font-weight:700; line-height:30px; color:#f0f4f7; font-variant-numeric:tabular-nums; white-space:nowrap; }
.navigation__destination { margin-top:2px; font-size:18px; font-weight:400; line-height:22px; color:#c0c5c7; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Phone notifications (phone closed) — bottom-right, above the vehicle panel */
.phone-notifs { position:absolute; right:calc(28px * var(--hud-scale)); bottom:calc(172px * var(--hud-scale)); width:300px; display:flex; flex-direction:column-reverse; gap:8px; transform:scale(var(--hud-scale)); transform-origin:bottom right; }
.pnotif { display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:14px; background:var(--hud-card); border:1px solid var(--hud-card-border); animation:pnotifIn 200ms ease-out; transition:opacity 250ms linear, transform 250ms ease-in; }
.pnotif.is-leaving { opacity:0; transform:translateX(20px); }
.pnotif__icon { width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.pnotif__icon svg { width:17px !important; height:17px !important; stroke:#fff; }
.pnotif__icon--sms { background:linear-gradient(160deg,#3ccf7a,#1f9a55); }
.pnotif__icon--bank { background:linear-gradient(160deg,#5b7cfa,#3048b8); }
.pnotif__icon--svc { background:linear-gradient(160deg,#f2994a,#c0571d); }
.pnotif__main { min-width:0; flex:1; }
.pnotif__head { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--hud-muted); }
.pnotif__title { font-size:13px; font-weight:700; color:var(--hud-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pnotif__text { font-size:12.5px; color:var(--hud-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@keyframes pnotifIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

/* Photo mode: hide everything for a clean screenshot */
.hud.is-photo { visibility:hidden; }

/* Card depth */
.vitals__card, .radar-group, .identity, .money__row, .vehicle, .navigation, .pnotif { box-shadow:0 2px 8px rgba(0,0,0,.45); }
.track { box-shadow:inset 0 1px 3px rgba(0,0,0,.35); }

/* Pause / reduced motion */
.hud.is-paused *, .hud.is-paused *::before, .hud.is-paused *::after { animation-play-state:paused !important; }
.hud.no-motion *, .hud.no-motion *::before, .hud.no-motion *::after, .hud.is-resetting * { animation:none !important; transition:none !important; }
@media (prefers-reduced-motion:reduce) {
  .hud *, .hud *::before, .hud *::after { animation:none !important; transition:none !important; }
}

/* Responsive */
@media (max-width:1023px) {
  .identity { width:408px; height:48px; gap:10px; padding:0 14px; }
  .identity__subtitle, .identity__online { display:inline; }
  .identity__separator { display:block; }
  .identity__meta { font-size:12px; }
  .chat { width:340px; }
}
@media (max-width:620px) {
  .identity { top:calc(123px * var(--hud-scale)); }
  .money { top:calc(181px * var(--hud-scale)); }
}
</style>
</head><body>
<main class="hud" id="hud" aria-label="SKR HUD" style="display:none">

<section class="chat hud-group" id="chat"><div class="chat__history" id="chatHistory"></div></section>

<header class="identity hud-group">
  <strong class="identity__logo">SKR</strong>
  <span class="identity__subtitle">ROLEPLAY / PROTOTIP</span>
  <span class="identity__separator"></span>
  <span class="identity__meta" id="identityId">ID 0</span>
  <span class="identity__separator"></span>
  <span class="identity__meta identity__online" id="identityOnline">1 online</span>
</header>

<section class="money hud-group">
  <div class="money__row money__cash">
    <svg aria-hidden="true"><use href="icons/icons.svg#hud-wallet"/></svg>
    <span class="money__amount" id="moneyCash">$ 0</span>
  </div>
  <div class="money__row money__bank">
    <svg aria-hidden="true"><use href="icons/icons.svg#hud-bank"/></svg>
    <span class="money__amount" id="moneyBank">$ 0</span>
  </div>
</section>

<section class="navigation hud-group" id="navigation" hidden aria-label="Navigație">
  <svg class="navigation__arrow" id="navArrow" viewBox="0 0 24 24" aria-hidden="true"><path id="navArrowPath" d=""/></svg>
  <div class="navigation__content">
    <div class="navigation__distance" id="navDistance"></div>
    <div class="navigation__destination" id="navDestination"></div>
  </div>
</section>

<section class="radar-group hud-group">
  <div class="radar">
    <div class="radar__surface" id="radarSurface">
      <div class="radar__tiles" id="radarTiles"></div>
      <div class="radar__pin" id="radarPin" hidden>
        <svg aria-hidden="true"><use href="icons/icons.svg#hud-pin"/></svg>
      </div>
      <div class="radar__player" id="radarPlayer">
        <svg viewBox="0 0 14 14" style="fill:#74dce8;stroke:none" xmlns="http://www.w3.org/2000/svg"><polygon points="7,0 12,12 7,9 2,12"/></svg>
      </div>
    </div>
    <span class="radar__north">N</span>
  </div>
  <div class="location">
    <div class="location__city" id="locCity">---</div>
    <div class="location__area" id="locArea">---</div>
  </div>
</section>

<section class="vitals hud-group" id="vitals">
  <span class="vitals__card vitals__card--health" aria-hidden="true"></span>
  <span class="vitals__card vitals__card--armour" aria-hidden="true"></span>
  <span class="vitals__card vitals__card--food" aria-hidden="true"></span>
  <span class="vitals__card vitals__card--water" aria-hidden="true"></span>
  <svg class="vitals__heart" aria-hidden="true"><use href="icons/icons.svg#hud-heart"/></svg>
  <div class="track vitals__health"><span class="track__fill" id="healthBar" style="width:100%"></span></div>
  <svg class="vitals__shield" aria-hidden="true"><use href="icons/icons.svg#hud-shield"/></svg>
  <div class="track vitals__armour"><span class="track__fill" id="armourBar" style="width:0%"></span></div>
  <svg class="vitals__food" aria-hidden="true"><use href="icons/icons.svg#hud-food"/></svg>
  <span class="vitals__food-value" id="needHunger">100%</span>
  <svg class="vitals__water" aria-hidden="true"><use href="icons/icons.svg#hud-water"/></svg>
  <span class="vitals__water-value" id="needThirst">100%</span>
</section>

<section class="vehicle hud-group" id="vehicle">
  <span class="vehicle__speed" id="vehSpeed">000</span>
  <span class="vehicle__unit">KM/H<span class="vehicle__max" id="vehMax"></span></span>
  <i class="vehicle__divider vehicle__divider--first"></i>
  <span class="vehicle__gear" id="vehGear">N</span>
  <span class="vehicle__gear-label">GEAR</span>
  <i class="vehicle__divider vehicle__divider--second"></i>
  <svg class="vehicle__fuel-icon" aria-hidden="true"><use href="icons/icons.svg#hud-fuel"/></svg>
  <span class="vehicle__fuel-value" id="vehFuelText">0%</span>
  <div class="track vehicle__fuel-track"><span class="track__fill" id="vehFuelBar" style="width:0%"></span></div>
  <svg class="vehicle__belt" id="vehSeatbelt" aria-hidden="true"><use href="icons/icons.svg#hud-seatbelt"/></svg>
  <svg class="vehicle__engine" id="vehEngine" aria-hidden="true"><use href="icons/icons.svg#hud-engine"/></svg>
  <svg class="vehicle__lights" id="vehLights" aria-hidden="true"><use href="icons/icons.svg#hud-lights"/></svg>
</section>

<div class="voice hud-group" id="voice" aria-label="Voce"><i class="voice__bar"></i><i class="voice__bar"></i><i class="voice__bar"></i></div>
<div class="notifications" id="notifications" aria-live="polite"></div>
<div class="phone-notifs" id="phoneNotifs" aria-live="polite"></div>
</main>

<script>
(function () {
  'use strict';

  var $ = function(id) { return document.getElementById(id); };
  var clamp = function(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };
  var fmt = new Intl.NumberFormat('ro-RO');
  var lastSequence = -1;
  var userScale = 1.0;
  var chatFadeTimer = null;

  // ── Scaling (reference 1672×941) ──────────────────────────
  function resize() {
    var s = Math.max(0.75, Math.min(1.5,
      Math.min(window.innerWidth / 1672, window.innerHeight / 941) * userScale));
    document.documentElement.style.setProperty('--hud-scale', String(s));
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Minimap (original GTA SA radar tiles, vanilla range/rotation) ──
  // Range and orientation come from GTA (CRadar::m_radarRange, cachedSin/Cos) via
  // SKRClient.dll -> server -> "hud:radar". Vanilla maps m_radarRange to the radar
  // radius; here that radius is half the inner surface height.
  var GRID = 12;
  var TILE_WORLD = 500;
  var WORLD_MIN = -3000;
  var WORLD_MAX = 3000;
  var RADAR_W = 254;
  var RADAR_H = 176;
  var SURFACE_BORDER = 3;
  var INNER_W = RADAR_W - 2 * SURFACE_BORDER;
  var INNER_H = RADAR_H - 2 * SURFACE_BORDER;
  var RADIUS_PX = INNER_H / 2;
  var tileCache = {};
  var visibleTiles = {};
  var tilesEl = $('radarTiles');
  var northEl = document.querySelector('.radar__north');
  var radarTarget = null;
  var radarCur = null;
  var radarPin = null;
  var pinEl = $('radarPin');
  var lastFrame = 0;

  function getTileImg(idx) {
    if (tileCache[idx]) return tileCache[idx];
    var img = new Image();
    img.src = 'tiles/' + (idx < 10 ? 'radar0' + idx : 'radar' + idx) + '.png';
    img.style.position = 'absolute';
    img.style.display = 'block';
    tilesEl.appendChild(img);
    tileCache[idx] = img;
    return img;
  }

  function angleDiff(a, b) {
    var d = (b - a) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  }

  function onRadar(d) {
    if (!d || !isFinite(d.x) || !isFinite(d.y) || !(d.range > 1)) return;
    radarTarget = { x: d.x, y: d.y, heading: d.heading || 0, range: d.range, orient: d.orient || 0 };
    if (!radarCur) radarCur = { x: d.x, y: d.y, heading: radarTarget.heading, range: d.range, orient: radarTarget.orient };
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!radarTarget) return;
    var dt = lastFrame ? Math.min(0.25, (ts - lastFrame) / 1000) : 0;
    lastFrame = ts;
    // Updates arrive every ~100 ms; exponential smoothing hides the step without lagging far behind.
    var a = 1 - Math.exp(-dt / 0.06);
    radarCur.x += (radarTarget.x - radarCur.x) * a;
    radarCur.y += (radarTarget.y - radarCur.y) * a;
    radarCur.range += (radarTarget.range - radarCur.range) * a;
    radarCur.heading += angleDiff(radarCur.heading, radarTarget.heading) * a;
    radarCur.orient += angleDiff(radarCur.orient, radarTarget.orient) * a;
    renderMinimap(radarCur);
  }
  requestAnimationFrame(frame);

  function renderMinimap(st) {
    // Native radar (CRadar::DrawMap called from EndScene) handles the tile
    // sections and water; CEF only draws the UI overlays on top.
    var k = RADIUS_PX / st.range;
    var cx = INNER_W / 2, cy = INNER_H / 2;

    // GTA heading is counter-clockwise; on screen the arrow turns by (orient - heading).
    $('radarPlayer').style.transform = 'rotate(' + (st.orient - st.heading) + 'deg)';

    // Pin: kept on the radar edge when out of range.
    var rad = st.orient * Math.PI / 180;
    if (radarPin) {
      var dx = (radarPin.x - st.x) * k, dy = (st.y - radarPin.y) * k;
      var sx = Math.cos(rad) * dx - Math.sin(rad) * dy;
      var sy = Math.sin(rad) * dx + Math.cos(rad) * dy;
      var edgeX = cx - 8, edgeY = cy - 8;
      var f = Math.max(Math.abs(sx) / edgeX, Math.abs(sy) / edgeY, 1);
      pinEl.style.transform = 'translate(' + (cx + sx / f) + 'px,' + (cy + sy / f) + 'px)';
      pinEl.hidden = false;
    } else {
      pinEl.hidden = true;
    }

    // North marker sits on the radar edge in the direction of world north.
    var nx = Math.sin(rad), ny = -Math.cos(rad);
    var hw = RADAR_W / 2, hh = RADAR_H / 2;
    var t = Math.min(Math.abs(nx) > 1e-6 ? hw / Math.abs(nx) : Infinity,
                     Math.abs(ny) > 1e-6 ? hh / Math.abs(ny) : Infinity);
    northEl.style.left = (hw + nx * t - 13) + 'px';
    northEl.style.top = (hh + ny * t - 13) + 'px';
  }

  // ── Chat ──────────────────────────────────────────────────
  function resetChatFade() {
    var chat = $('chat');
    chat.classList.remove('is-idle');
    clearTimeout(chatFadeTimer);
    chatFadeTimer = setTimeout(function() { chat.classList.add('is-idle'); }, 8000);
  }

  function addChatLine(time, channel, name, msg, isSystem) {
    var chat = $('chat');
    var history = $('chatHistory');
    chat.classList.add('is-visible');

    var row = document.createElement('div');
    row.className = 'chat__row';

    var timeEl = document.createElement('time');
    timeEl.className = 'chat__time';
    timeEl.textContent = time;

    var msgEl = document.createElement('span');
    msgEl.className = 'chat__message';
    if (isSystem) {
      msgEl.innerHTML = '';
      var ch = document.createElement('b');
      ch.className = 'chat__channel';
      ch.textContent = '[Sistem]';
      msgEl.appendChild(ch);
      msgEl.appendChild(document.createTextNode(' ' + msg));
    } else {
      var ch = document.createElement('b');
      ch.className = 'chat__channel';
      ch.textContent = '[' + channel + ']';
      var nm = document.createElement('b');
      nm.className = 'chat__name';
      nm.textContent = ' ' + name + ':';
      msgEl.appendChild(ch);
      msgEl.appendChild(nm);
      msgEl.appendChild(document.createTextNode(' ' + msg));
    }

    row.appendChild(timeEl);
    row.appendChild(msgEl);
    history.appendChild(row);

    while (history.children.length > 50) history.removeChild(history.firstChild);
    resetChatFade();
  }

  // ── HUD update ────────────────────────────────────────────
  function updateHud(data) {
    if (!data || typeof data !== 'object') return;
    if (data.sequence != null && data.sequence <= lastSequence) return;
    if (data.sequence != null) lastSequence = data.sequence;

    var p = data.payload || data;
    var hud = $('hud');
    if (p.visible === false) { hud.style.display = 'none'; return; }
    hud.style.display = '';

    if (p.player) {
      if (p.player.id != null) $('identityId').textContent = 'ID ' + p.player.id;
      if (p.player.online != null) $('identityOnline').textContent = p.player.online + ' online';
      if (p.player.cash != null) $('moneyCash').textContent = '$ ' + fmt.format(p.player.cash);
      if (p.player.bank != null) $('moneyBank').textContent = '$ ' + fmt.format(p.player.bank);
    }

    if (p.vitals) {
      var hp = clamp(p.vitals.health || 0, 0, 100);
      var ar = clamp(p.vitals.armour || 0, 0, 100);
      $('healthBar').style.width = hp + '%';
      $('vitals').classList.toggle('is-low-health', hp < 25);
      $('armourBar').style.width = ar + '%';
      if (p.vitals.hunger != null) $('needHunger').textContent = clamp(p.vitals.hunger, 0, 100) + '%';
      if (p.vitals.thirst != null) $('needThirst').textContent = clamp(p.vitals.thirst, 0, 100) + '%';
    }

    if (p.location) {
      if (p.location.city) $('locCity').textContent = p.location.city;
      if (p.location.area) $('locArea').textContent = p.location.area;
    }


    if (p.vehicle) {
      var veh = $('vehicle');
      veh.classList.toggle('is-visible', !!p.vehicle.active);
      if (p.vehicle.active) {
        var spd = clamp(Math.round(p.vehicle.speedKmh || 0), 0, 999);
        $('vehSpeed').textContent = String(spd).padStart(3, '0');
        var maxKmh = Math.round(p.vehicle.maxKmh || 0);
        $('vehMax').textContent = maxKmh > 0 ? '· MAX ' + maxKmh : '';
        $('vehGear').textContent = p.vehicle.gear || 'N';
        var fuel = clamp(p.vehicle.fuel || 0, 0, 100);
        $('vehFuelText').textContent = fuel + '%';
        $('vehFuelBar').style.width = fuel + '%';
        veh.classList.toggle('is-low-fuel', fuel < 15);
        $('vehSeatbelt').classList.toggle('is-fastened', !!p.vehicle.seatbelt);
        $('vehEngine').classList.toggle('is-on', !!p.vehicle.engine);
        $('vehEngine').classList.toggle('is-warning', !!p.vehicle.engineWarning);
        $('vehLights').classList.toggle('is-on', !!p.vehicle.lights);
      }
    }

    if (p.voice) {
      var voiceEl = $('voice');
      voiceEl.classList.toggle('is-visible', p.voice.available && p.voice.talking);
      voiceEl.classList.toggle('is-talking', p.voice.available && p.voice.talking);
    }
  }

  function showNotification(text, duration) {
    duration = duration || 5000;
    var container = $('notifications');
    if (container.children.length >= 3) return;
    var notif = document.createElement('div');
    notif.className = 'notification';
    notif.textContent = text;
    container.appendChild(notif);
    setTimeout(function() {
      notif.style.opacity = '0';
      setTimeout(function() { notif.remove(); }, 200);
    }, Math.min(duration, 5000));
  }

  // ── Navigation indicator ─────────────────────────────────
  // updateNavigation(payload) — internal SKR contract (not an SA-MP/CEF API):
  //   { active: bool, destination: string <= 120, distanceMeters: number >= 0,
  //     nextTurn: "left"|"right"|"straight"|"uturn"|null, nextTurnMeters: number >= 0 | null }
  // With nextTurn (real routing): turn arrow, row 1 = distance to the manoeuvre,
  // row 2 = destination · remaining route distance. Without it (waypoint only): pin icon,
  // row 1 = distance to the waypoint (the server sends straight-line distance), row 2 = name.
  var NAV_ICONS = {
    left: 'M15 19v-6a4 4 0 0 0-4-4H5m4-4-4 4 4 4',
    right: 'M9 19v-6a4 4 0 0 1 4-4h6m-4-4 4 4-4 4',
    straight: 'M12 20V5m-5 5 5-5 5 5',
    uturn: 'M8 20V9a4 4 0 0 1 8 0v4m-4-1 4 4 4-4',
    pin: 'M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Zm0-9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z'
  };
  var NAV_TURNS = ['left', 'right', 'straight', 'uturn'];

  function navDistance(m) {
    if (Math.round(m) < 1000) return Math.round(m) + ' m';
    var km = Math.round(m / 100) / 10;
    return (km % 1 === 0 ? String(km) : km.toFixed(1).replace('.', ',')) + ' km';
  }
  function navNumber(v) { return typeof v === 'number' && isFinite(v) && v >= 0 ? v : null; }

  function updateNavigation(p) {
    var box = $('navigation');
    if (!p || p.active !== true) {
      box.hidden = true;
      $('navDistance').textContent = '';
      $('navDestination').textContent = '';
      $('navArrowPath').setAttribute('d', '');
      return;
    }
    var dest = typeof p.destination === 'string' ? p.destination.slice(0, 120) : '';
    var dist = navNumber(p.distanceMeters);
    var turn = NAV_TURNS.indexOf(p.nextTurn) >= 0 ? p.nextTurn : null;
    var turnDist = turn ? navNumber(p.nextTurnMeters) : null;
    if (dist === null) { updateNavigation(null); return; }   // invalid data: hide rather than show 0

    var routed = turn !== null && turnDist !== null;
    var arrow = $('navArrow');
    arrow.classList.toggle('navigation__arrow--pin', !routed);
    $('navArrowPath').setAttribute('d', NAV_ICONS[routed ? turn : 'pin']);
    $('navDistance').textContent = navDistance(routed ? turnDist : dist);
    $('navDestination').textContent = routed ? (dest ? dest + ' · ' : '') + navDistance(dist) : (dest || 'Destinație');
    box.hidden = false;
  }

  // ── Phone notifications ──────────────────────────────────
  var PNOTIF_ICONS = {
    sms: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12Z"/>',
    bank: '<path d="m3 9 9-5 9 5ZM4 20h16M6 11v6M10 11v6M14 11v6M18 11v6"/>',
    svc: '<path d="M12 2v4M5 7l2.5 2.5M19 7l-2.5 2.5M4 15h16M6 15a6 6 0 0 1 12 0M3 19h18"/>'
  };
  function phoneNotify(d) {
    if (!d || typeof d.title !== 'string') return;
    var app = PNOTIF_ICONS[d.app] ? d.app : 'sms';
    var box = $('phoneNotifs');
    while (box.children.length >= 3) box.removeChild(box.lastChild);
    var n = document.createElement('div');
    n.className = 'pnotif';
    var icon = document.createElement('span');
    icon.className = 'pnotif__icon pnotif__icon--' + app;
    icon.innerHTML = '<svg viewBox="0 0 24 24">' + PNOTIF_ICONS[app] + '</svg>';   // static, not received text
    var main = document.createElement('div');
    main.className = 'pnotif__main';
    var head = document.createElement('div');
    head.className = 'pnotif__head';
    var title = document.createElement('span');
    title.className = 'pnotif__title';
    title.textContent = d.title;
    var hint = document.createElement('span');
    hint.textContent = 'L';
    head.appendChild(title);
    head.appendChild(hint);
    var text = document.createElement('div');
    text.className = 'pnotif__text';
    text.textContent = String(d.text || '');
    main.appendChild(head);
    main.appendChild(text);
    n.appendChild(icon);
    n.appendChild(main);
    box.insertBefore(n, box.firstChild);
    setTimeout(function () {
      n.classList.add('is-leaving');
      setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 260);
    }, 5000);
  }

  function setPhotoMode(on) { $('hud').classList.toggle('is-photo', !!on); }

  window.skrHud = { update: updateHud, radar: onRadar, addChat: addChatLine, notify: showNotification,
                    phoneNotify: phoneNotify, photoMode: setPhotoMode, navigation: updateNavigation };

  if (typeof cef !== 'undefined' && cef.on) {
    cef.on('hud:update', function() {
      try { updateHud(JSON.parse(arguments[0])); } catch(e) {}
    });
    cef.on('hud:radar', function() {
      try { onRadar(JSON.parse(arguments[0])); } catch(e) {}
    });
    cef.on('hud:navigation', function() {
      try { updateNavigation(JSON.parse(arguments[0])); } catch(e) { updateNavigation(null); }
    });
    cef.on('hud:phoneNotify', function() {
      try { phoneNotify(JSON.parse(arguments[0])); } catch(e) {}
    });
    cef.on('hud:photo', function() {
      try { setPhotoMode(JSON.parse(arguments[0]).on); } catch(e) {}
    });
    cef.on('hud:pin', function() {
      try {
        var d = JSON.parse(arguments[0]);
        radarPin = d && d.set && isFinite(d.x) && isFinite(d.y) ? { x: d.x, y: d.y } : null;
      } catch(e) {}
    });
    cef.on('hud:chat', function() {
      try {
        var d = JSON.parse(arguments[0]);
        addChatLine(d.time, d.channel, d.name, d.msg, d.system);
      } catch(e) {}
    });
    cef.on('hud:notify', function() {
      try {
        var d = JSON.parse(arguments[0]);
        showNotification(d.text, d.duration);
      } catch(e) {}
    });
  }
})();
</script>
</body></html>
