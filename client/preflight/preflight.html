<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SKR Enhanced — Verification</title>
  <link rel="stylesheet" href="preflight.css">
</head>
<body>
  <section class="launcher" aria-label="SKR Enhanced preflight">
    <header class="titlebar" id="dragRegion">
      <div class="product"><span class="product-mark">S</span><span>SKR ENHANCED</span></div>
      <div class="window-controls" aria-label="Window controls">
        <button type="button" id="minimize" aria-label="Minimize">—</button>
        <button type="button" id="closeWindow" aria-label="Close">×</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <div class="toast" id="toast" role="status" hidden></div>
  </section>
  <script src="preflight.js"></script>
</body>
</html>
