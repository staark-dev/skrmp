<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SKR Register</title>
<style>
:root {
  --panel: rgba(18,23,30,.92);
  --panel-border: rgba(210,225,233,.15);
  --text: #f0f4f7;
  --secondary: #a7b4c0;
  --muted: #84939f;
  --accent: #d4b475;
  --accent-hover: #e0c48a;
  --danger: #e85b68;
  --success: #5cbf7a;
  --input-bg: rgba(255,255,255,.04);
  --input-border: rgba(210,225,233,.12);
  --input-focus: rgba(212,180,117,.4);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
body { font-family: Inter, "Segoe UI", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; display:flex; align-items:center; justify-content:center; }

.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.65);
  display: flex; align-items: center; justify-content: center;
  opacity: 1; pointer-events: auto;
}
.panel {
  width: 360px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 32px 28px 24px;
  display: flex; flex-direction: column;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  animation: panelIn 250ms ease-out;
}
@keyframes panelIn {
  from { transform: scale(.94) translateY(12px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.header { text-align: center; margin-bottom: 24px; }
.logo {
  font-family: 'Bahnschrift Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif;
  font-stretch: condensed;
  font-size: 38px; font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px; line-height: 1;
  user-select: none;
}
.subtitle {
  font-size: 10px; font-weight: 500;
  color: var(--muted);
  letter-spacing: 4px; text-transform: uppercase;
  margin-top: 4px; user-select: none;
}
.welcome {
  font-size: 13px; color: var(--secondary);
  text-align: center; margin-bottom: 20px;
}
.welcome strong { color: var(--text); }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field-label {
  font-size: 11px; font-weight: 600;
  color: var(--secondary);
  letter-spacing: 1px; text-transform: uppercase;
  user-select: none;
}
.field-input {
  width: 100%; height: 42px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: 0 14px;
  color: var(--text);
  font-family: inherit; font-size: 14px;
  outline: none;
  transition: border-color 150ms, background 150ms;
}
.field-input::placeholder { color: var(--muted); }
.field-input:focus { border-color: var(--input-focus); background: rgba(255,255,255,.06); }
.field-input.error { border-color: var(--danger); }

.btn-submit {
  width: 100%; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(212,180,117,.12);
  border: 1px solid rgba(212,180,117,.25);
  border-radius: 8px;
  color: var(--accent);
  font-family: inherit; font-size: 14px; font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
  outline: none; user-select: none;
  margin-top: 4px;
}
.btn-submit:hover { background: rgba(212,180,117,.22); border-color: rgba(212,180,117,.4); color: var(--accent-hover); }
.btn-submit:active { background: rgba(212,180,117,.3); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.status {
  min-height: 18px; font-size: 12px;
  text-align: center; margin-top: 8px;
}
.status.error { color: var(--danger); }
.status.success { color: var(--success); }
.status.info { color: var(--muted); }

.footer { font-size: 11px; color: var(--muted); text-align: center; margin-top: 16px; user-select: none; }
</style>
</head>
<body>

<div class="overlay">
  <div class="panel">
    <div class="header">
      <div class="logo">SKR</div>
      <div class="subtitle">Roleplay</div>
    </div>

    <div class="welcome" id="welcome">Bine ai venit! Creeaza-ti un cont.</div>

    <div class="field">
      <label class="field-label" for="password">Parola</label>
      <input class="field-input" type="password" id="password" placeholder="Alege o parola" maxlength="64" autofocus>
    </div>
    <div class="field">
      <label class="field-label" for="password2">Confirma parola</label>
      <input class="field-input" type="password" id="password2" placeholder="Repeta parola" maxlength="64">
    </div>

    <button class="btn-submit" id="btn-register">Creeaza cont</button>
    <div class="status" id="status"></div>
    <div class="footer">SKR Client v0.1.0</div>
  </div>
</div>

<script>
(function() {
  var statusEl = document.getElementById('status');
  var welcomeEl = document.getElementById('welcome');
  var passEl = document.getElementById('password');
  var pass2El = document.getElementById('password2');
  var btnEl = document.getElementById('btn-register');
  var submitting = false;
  var playerName = '';

  function cefOn(event, fn) {
    if (window.cef && typeof cef.on === 'function') cef.on(event, fn);
  }
  function cefEmit(event, data) {
    if (window.cef && typeof cef.emit === 'function') {
      if (data !== undefined) cef.emit(event, data);
      else cef.emit(event);
    }
  }

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (type || '');
  }

  cefOn('skr:auth:init', function(json) {
    try {
      var data = typeof json === 'string' ? JSON.parse(json) : (json || {});
      if (data.name) {
        playerName = data.name;
        welcomeEl.innerHTML = 'Bine ai venit, <strong>' + playerName.replace(/</g, '&lt;') + '</strong>! Alege o parola.';
      }
    } catch(e) {}
  });

  btnEl.addEventListener('click', function() {
    if (submitting) return;
    passEl.classList.remove('error');
    pass2El.classList.remove('error');
    var pass = passEl.value;
    var pass2 = pass2El.value;

    if (!pass) {
      passEl.classList.add('error');
      setStatus('Alege o parola.', 'error');
      return;
    }
    if (pass.length < 6) {
      passEl.classList.add('error');
      setStatus('Parola trebuie sa aiba cel putin 6 caractere.', 'error');
      return;
    }
    if (pass !== pass2) {
      pass2El.classList.add('error');
      setStatus('Parolele nu coincid.', 'error');
      return;
    }

    submitting = true;
    btnEl.disabled = true;
    setStatus('Se creeaza contul...', 'info');
    cefEmit('skr:auth:register', JSON.stringify({ username: playerName, password: pass }));
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !submitting) btnEl.click();
  });

  cefOn('skr:auth:result', function(json) {
    var data;
    try { data = typeof json === 'string' ? JSON.parse(json) : (json || {}); } catch(e) { data = {}; }

    if (data.success) {
      setStatus(data.message || 'Cont creat cu succes!', 'success');
    } else {
      setStatus(data.message || 'Inregistrarea a esuat.', 'error');
      submitting = false;
      btnEl.disabled = false;
    }
  });

  cefEmit('skr:auth:ready');
})();
</script>
</body></html>
